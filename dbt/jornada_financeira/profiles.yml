jornada_financeira:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_DEV') }}"
      dataset: raw
      keyfile: "{{ env_var('GCP_CREDENTIALS') }}"
      location: southamerica-east1
      threads: 4
      timeout_seconds: 300
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_PROD') }}"
      dataset: raw
      keyfile: "{{ env_var('GCP_CREDENTIALS') }}"
      location: southamerica-east1
      threads: 8
      timeout_seconds: 600